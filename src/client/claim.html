<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Office · Your password</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72" shape-rendering="crispEdges"><rect x="6" y="30" width="52" height="8" fill="#b88a58"/><rect x="6" y="38" width="52" height="3" fill="#8a6339"/><rect x="18" y="12" width="28" height="18" fill="#29464a"/><rect x="21" y="15" width="22" height="12" fill="#8fe3b0"/><rect x="24" y="19" width="4" height="4" fill="#29464a"/><rect x="36" y="19" width="4" height="4" fill="#29464a"/><rect x="23" y="41" width="18" height="16" fill="#216c70"/><rect x="26" y="45" width="4" height="4" fill="#fff9ee"/><rect x="34" y="45" width="4" height="4" fill="#fff9ee"/></svg>
      </div>
      <h1 id="title">Your office is ready 🎉</h1>
      <p class="sub" id="sub">Unlocking…</p>
      <section id="reveal" hidden>
        <p class="warn"><strong>Write this password down now.</strong> It is shown this one time only — the office keeps just a hash and can never display it again. Share it with teammates you invite.</p>
        <div class="secret"><code id="pw"></code><button type="button" id="copy" class="mini">Copy</button></div>
        <label class="check"><input type="checkbox" id="saved" /> I saved it somewhere safe</label>
        <button type="button" id="enter" disabled>Enter the office</button>
      </section>
      <p id="error" class="error" role="alert"></p>
      <a id="login" href="/login" hidden>Go to sign in →</a>
    </main>
    <script type="module" src="./claim.ts"></script>
  </body>
</html>
