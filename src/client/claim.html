<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Office · 사무실 비밀번호</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72"><rect x="6" y="30" width="52" height="8" rx="3" fill="#e0a96d"/><rect x="18" y="14" width="28" height="18" rx="3" fill="#2b2d42"/><rect x="21" y="17" width="22" height="12" rx="1" fill="#7cf29a"/><circle cx="32" cy="50" r="9" fill="#ff8a5b"/><circle cx="29" cy="48" r="1.8" fill="#222"/><circle cx="35" cy="48" r="1.8" fill="#222"/></svg>
      </div>
      <h1 id="title">사무실이 준비되었습니다 🎉</h1>
      <p class="sub" id="sub">입장 정보를 준비하는 중…</p>
      <section id="reveal" hidden>
        <p class="warn"><strong>지금 비밀번호를 따로 저장하세요.</strong> 이 비밀번호는 한 번만 표시됩니다. 이후에는 해시만 저장하므로 다시 보여드릴 수 없습니다. 초대한 팀원에게 공유하세요.</p>
        <div class="secret"><code id="pw"></code><button type="button" id="copy" class="mini">복사</button></div>
        <label class="check"><input type="checkbox" id="saved" /> 비밀번호를 안전한 곳에 저장했습니다</label>
        <button type="button" id="enter" disabled>사무실 입장</button>
      </section>
      <p id="error" class="error" role="alert"></p>
      <a id="login" href="/login" hidden>로그인 화면으로 →</a>
    </main>
    <script type="module" src="./claim.ts"></script>
  </body>
</html>
