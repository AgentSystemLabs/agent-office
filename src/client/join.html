<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-t="auth.joinTitle">Agent Office · Join</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72"><rect x="6" y="30" width="52" height="8" rx="3" fill="#e0a96d"/><rect x="18" y="14" width="28" height="18" rx="3" fill="#2b2d42"/><rect x="21" y="17" width="22" height="12" rx="1" fill="#7cf29a"/><circle cx="32" cy="50" r="9" fill="#ff8a5b"/><circle cx="29" cy="48" r="1.8" fill="#222"/><circle cx="35" cy="48" r="1.8" fill="#222"/></svg>
      </div>
      <h1 id="title" data-t="auth.invited">You're invited 🎉</h1>
      <p class="sub" id="sub" data-t="auth.checking">Checking your invite…</p>
      <form id="form" hidden>
        <label><span data-t="auth.yourName">Your name</span><input id="name" type="text" maxlength="24" autocomplete="username" spellcheck="false" required /></label>
        <label><span data-t="auth.pickPassword">Pick a password</span><input id="password" type="password" minlength="8" autocomplete="new-password" required /></label>
        <label><span data-t="auth.onceMore">Once more</span><input id="again" type="password" minlength="8" autocomplete="new-password" required /></label>
        <p class="note" data-t="auth.atLeast8">At least 8 characters. It's yours alone: nobody else in the office ever sees it.</p>
        <button type="submit" id="submit" data-t="auth.makeAccount">Make my account</button>
      </form>
      <p id="error" class="error" role="alert"></p>
      <a id="login" href="/login" hidden data-t="auth.goSignIn">Go to sign in →</a>
    </main>
    <script type="module" src="./join.ts"></script>
  </body>
</html>
