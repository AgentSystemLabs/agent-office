<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Office · 초대받아 입장</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72"><rect x="6" y="30" width="52" height="8" rx="3" fill="#e0a96d"/><rect x="18" y="14" width="28" height="18" rx="3" fill="#2b2d42"/><rect x="21" y="17" width="22" height="12" rx="1" fill="#7cf29a"/><circle cx="32" cy="50" r="9" fill="#ff8a5b"/><circle cx="29" cy="48" r="1.8" fill="#222"/><circle cx="35" cy="48" r="1.8" fill="#222"/></svg>
      </div>
      <h1 id="title">사무실에 초대받았습니다 🎉</h1>
      <p class="sub" id="sub">초대 정보를 확인하는 중…</p>
      <form id="form" hidden>
        <label>표시 이름<input id="name" type="text" maxlength="24" autocomplete="username" spellcheck="false" required /></label>
        <label>비밀번호 설정<input id="password" type="password" minlength="8" autocomplete="new-password" required /></label>
        <label>비밀번호 확인<input id="again" type="password" minlength="8" autocomplete="new-password" required /></label>
        <p class="note">8자 이상으로 설정하세요. 내 계정의 비밀번호는 다른 참여자에게 공개되지 않습니다.</p>
        <button type="submit" id="submit">계정 만들기</button>
      </form>
      <p id="error" class="error" role="alert"></p>
      <a id="login" href="/login" hidden>로그인 화면으로 →</a>
    </main>
    <script type="module" src="./join.ts"></script>
  </body>
</html>
