<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Office · Sign in</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72" shape-rendering="crispEdges"><rect x="6" y="30" width="52" height="8" fill="#b88a58"/><rect x="6" y="38" width="52" height="3" fill="#8a6339"/><rect x="18" y="12" width="28" height="18" fill="#29464a"/><rect x="21" y="15" width="22" height="12" fill="#8fe3b0"/><rect x="24" y="19" width="4" height="4" fill="#29464a"/><rect x="36" y="19" width="4" height="4" fill="#29464a"/><rect x="23" y="41" width="18" height="16" fill="#216c70"/><rect x="26" y="45" width="4" height="4" fill="#fff9ee"/><rect x="34" y="45" width="4" height="4" fill="#fff9ee"/></svg>
      </div>
      <h1>Agent Office</h1>
      <p class="sub" id="sub">Knock knock. What's the password?</p>
      <form id="form">
        <label id="name-row" hidden>Your name<input id="name" type="text" maxlength="24" autocomplete="username" spellcheck="false" /></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" autofocus required /></label>
        <p id="name-note" class="note" hidden>Came in with the shared office password? Leave your name blank.</p>
        <button type="submit" id="submit">Come on in</button>
        <p id="error" class="error" role="alert"></p>
      </form>
    </main>
    <script type="module" src="./login.ts"></script>
  </body>
</html>
