<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Office · Sign in</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <img src="/factory-glyph.svg" width="72" height="72" alt="" />
      </div>
      <h1>Agent Office</h1>
      <p class="sub" id="sub">Knock knock. What's the password?</p>
      <form id="form">
        <label id="name-row" hidden>Your name<input id="name" type="text" maxlength="24" autocomplete="username" spellcheck="false" /></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" autofocus required /></label>
        <p id="name-note" class="note" hidden>Came in with the shared office password? Leave your name blank.</p>
        <button type="submit" id="submit">Come on in</button>
        <p id="error" class="error" role="alert"></p>
      </form>
    </main>
    <script type="module" src="./login.ts"></script>
  </body>
</html>
